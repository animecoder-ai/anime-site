<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AnimeCoder AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
    body{background:#0f0f14;color:white;}
    header{padding:20px;text-align:center;background:#12121a;}
    h1{color:#00f7ff;}
    .container{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;}
    .card{background:#1a1a26;padding:15px;border-radius:10px;text-align:center;transition:0.3s;}
    .card:hover{transform:scale(1.05);box-shadow:0 0 15px #00f7ff55;}
    .card img{width:80px;height:80px;border-radius:50%;object-fit:cover;margin-bottom:10px;}
    .name{font-weight:bold;}
    .username{color:#aaa;font-size:13px;}
    a{color:#00f7ff;text-decoration:none;font-size:13px;}
    footer{text-align:center;padding:15px;color:#666;font-size:12px;}
  </style>
</head>
<body>

<header>
  <h1>AnimeCoder AI</h1>
  <p>Anime Creators Community</p>
</header>

<div class="container">

  <div class="card">
    <img src="https://i.imgur.com/1X8sQ5P.png">
    <div class="name">Lyrical Vibes</div>
    <div class="username">@lyricalvibesofficial_1</div>
    <a href="https://instagram.com/lyricalvibesofficial_1" target="_blank">View Profile</a>
  </div>

  <!-- Copy this block to add more profiles -->

</div>

<footer>
  © 2026 AnimeCoder AI | Built with ❤️ for anime fans
</footer>

</body>
</html>
