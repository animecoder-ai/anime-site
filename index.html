<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AnimeCoder AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#0f0f14;color:white;}
header{text-align:center;padding:20px;background:#12121a;}
h1{color:#00f7ff;}
.controls,.form-box{display:flex;gap:10px;justify-content:center;padding:15px;flex-wrap:wrap;}
input,select,button{padding:10px;border-radius:8px;border:none;background:#1a1a26;color:white;}
button{border:1px solid #00f7ff44;cursor:pointer;}
.container{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;}
.card{background:#1a1a26;padding:15px;border-radius:12px;text-align:center;border:1px solid #00f7ff22;}
.category{font-size:11px;color:#00f7ff;}
.name{font-weight:bold;}
.username{font-size:13px;color:#aaa;}
a{color:#00f7ff;font-size:13px;text-decoration:none;}
footer{text-align:center;color:#666;padding:15px;font-size:12px;}
</style>
</head>

<body>

<header>
<h1>AnimeCoder AI</h1>
<p>AI Powered Anime Creator Platform</p>
</header>

<div class="form-box">
<input id="nameInput" placeholder="Creator Name">
<input id="userInput" placeholder="Username">
<input id="linkInput" placeholder="Profile Link">
<select id="catInput">
<option value="lyrics">Lyrics</option>
<option value="amv">AMV</option>
<option value="edits">Edits</option>
<option value="anime">Anime</option>
</select>
<button onclick="addProfile()">Submit</button>
</div>

<div class="container" id="cards"></div>

<footer>© 2026 AnimeCoder AI | Backend Powered Platform ⚡</footer>

<script>
/* 🔥 FIREBASE CONFIG — YAHAN APNA CONFIG PASTE KARNA */
const firebaseConfig = {
  apiKey: "PASTE_HERE",
  authDomain: "PASTE_HERE",
  projectId: "PASTE_HERE",
  storageBucket: "PASTE_HERE",
  messagingSenderId: "PASTE_HERE",
  appId: "PASTE_HERE"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const cardsContainer = document.getElementById("cards");

function addProfile(){
  const name = nameInput.value;
  const user = userInput.value;
  const link = linkInput.value;
  const cat = catInput.value;

  if(!name || !user || !link) return alert("Fill all fields");

  db.collection("profiles").add({
    name, user, link, cat
  });

  nameInput.value="";
  userInput.value="";
  linkInput.value="";
}

/* 🔥 REAL-TIME LOAD */
db.collection("profiles").onSnapshot(snapshot=>{
  cardsContainer.innerHTML="";
  snapshot.forEach(doc=>{
    const d = doc.data();
    const card = document.createElement("div");
    card.className="card";
    card.innerHTML=`
      <div class="category">${d.cat.toUpperCase()}</div>
      <div class="name">${d.name}</div>
      <div class="username">@${d.user}</div>
      <a href="${d.link}" target="_blank">View Profile</a>
    `;
    cardsContainer.prepend(card);
  });
});
</script>

</body>
</html>
